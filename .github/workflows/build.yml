name: Build APK

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  OPENAVER_BUILD_PYTHON: python

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v4

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: slive777/OpenAver
          ref: af0d99741e63e71980773c9ade04c473407a60b7
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify upstream patch layering
        run: |
          python tools/verify_python_sync.py \
            --upstream-root upstream \
            --source-root app/src/main/python

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run smoke tests
        run: python -m pytest tests/ -q

      - name: Build unsigned arm64 release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Pabi=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openaver-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openaver-build-logs
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
