name: Publish Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  OPENAVER_BUILD_PYTHON: python

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout pinned upstream source
        uses: actions/checkout@v7
        with:
          repository: slive777/OpenAver
          ref: af0d99741e63e71980773c9ade04c473407a60b7
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'platform-tools' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify upstream patch layering
        run: |
          python tools/verify_python_sync.py \
            --upstream-root upstream \
            --source-root app/src/main/python

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run smoke tests
        run: python -m pytest tests/ -q

      - name: Decode required release keystore
        shell: bash
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for tagged releases." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openaver-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/openaver-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed arm64 release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease -Pabi=arm64-v8a

      - name: Read app version and prepare release body
        shell: bash
        run: |
          version_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -n 1)"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$version_name"
          test -n "$version_code"

          mkdir -p dist
          {
            echo "## OpenAver Mobile ${GITHUB_REF_NAME}"
            echo
            echo "- versionName: \`${version_name}\`"
            echo "- versionCode: \`${version_code}\`"
            echo "- ABI: \`arm64-v8a\`"
          } > dist/RELEASE_BODY.md

      - name: Prepare release files
        shell: bash
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "dist/openaver-${GITHUB_REF_NAME}-arm64-v8a.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_BODY.md
          generate_release_notes: true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openaver-release-logs
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7
