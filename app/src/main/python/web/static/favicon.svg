<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A4C"/>
      <stop offset="100%" style="stop-color:#FFB48A"/>
    </linearGradient>
  </defs>

  <!-- 圓形背景 -->
  <circle cx="32" cy="32" r="30" fill="#1A1D24" stroke="#2D333E" stroke-width="2"/>

  <!-- A 字母 - 播放按鈕風格 -->
  <path d="M20 47 L32 16 L44 47"
        fill="none"
        stroke="url(#gradient)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- A 橫線 -->
  <path d="M24.5 37.5 L39.5 37.5"
        fill="none"
        stroke="url(#gradient)"
        stroke-width="4.5"
        stroke-linecap="round"/>
</svg>
