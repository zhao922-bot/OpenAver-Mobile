plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def openaverRelease = "v0.18.17-r11"
def openaverCommit = "af0d99741e63e71980773c9ade04c473407a60b7"
def requestedAbis = (project.findProperty("abi") ?: "arm64-v8a")
        .split(",")
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
def openaverBuildPython = System.getenv("OPENAVER_BUILD_PYTHON")
        ?: project.findProperty("openaverBuildPython")
def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")
        ?: project.findProperty("androidKeystorePath")
def releaseKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
        ?: project.findProperty("keystorePassword")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
        ?: project.findProperty("keyAlias")
def releaseKeyPassword = System.getenv("KEY_PASSWORD")
        ?: project.findProperty("keyPassword")
def hasReleaseSigning = releaseKeystore && releaseKeystorePassword
        && releaseKeyAlias && releaseKeyPassword

android {
    namespace "dev.openaver.mobile"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "dev.openaver.mobile"
        minSdk 29
        targetSdk 29
        versionCode 18011
        versionName "0.18.17-r11"

        buildConfigField "String", "OPENAVER_RELEASE", "\"${openaverRelease}\""
        buildConfigField "String", "OPENAVER_COMMIT", "\"${openaverCommit}\""

        ndk {
            abiFilters.addAll(requestedAbis)
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                    "META-INF/LICENSE*",
                    "META-INF/NOTICE*"
            ]
        }
    }

    lint {
        // Sideload-only release: target 29 preserves legacy external storage
        // needed for removable SD cards on Android 10.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

chaquopy {
    sourceSets {
        getByName("main") {
            // Runtime files in a developer checkout must never enter an APK.
            exclude("output", "output/**", "logs", "logs/**", "web/config.json")
        }
    }
    defaultConfig {
        version = "3.13"
        if (openaverBuildPython) {
            buildPython(openaverBuildPython.toString())
        }
        extractPackages("core", "web")
        pip {
            options("--find-links", "wheels")
            install("fastapi==0.136.1")
            install("starlette==1.6.0")
            install("uvicorn==0.46.0")
            install("jinja2==3.1.6")
            install("python-multipart==0.0.32")
            install("requests==2.33.1")
            install("urllib3==2.8.0")
            install("httpx==0.28.1")
            install("beautifulsoup4==4.14.3")
            install("pydantic==2.12.5")
            install("pillow==11.0.0")
            install("PyYAML==6.0.3")
        }
        pyc {
            src = true
        }
    }
}

def releasePythonAppImy = layout.buildDirectory.file(
        "python/assets/source/release/chaquopy/app.imy"
)
def releaseAssetPython = openaverBuildPython ?: "python"
def minifyReleaseWebAssets = tasks.register("minifyReleaseWebAssets") {
    group = "build"
    description = "Minifies first-party JS/CSS in the generated release app.imy"
    dependsOn tasks.named("generateReleasePythonBuildAssets")

    inputs.file(rootProject.file("tools/minify-release-web-assets.py"))
    inputs.file(rootProject.file("tools/echarts-build/minify-entrypoints.mjs"))
    inputs.file(rootProject.file("tools/echarts-build/package-lock.json"))
    inputs.files(fileTree("app/src/main/python/web/static") {
        include "js/**/*.js"
        include "css/**/*.css"
    })
    outputs.file(releasePythonAppImy)

    doLast {
        exec {
            commandLine(
                    releaseAssetPython.toString(),
                    rootProject.file(
                            "tools/minify-release-web-assets.py"
                    ),
                    "--archive",
                    releasePythonAppImy.get().asFile,
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("generate") && task.name.endsWith("PythonBuildAssets")) {
        def variantName = task.name.substring("generate".length(),
                task.name.length() - "PythonBuildAssets".length())
        def variantDir = variantName.substring(0, 1).toLowerCase() + variantName.substring(1)
        task.doLast {
            project.exec {
                commandLine(
                        releaseAssetPython.toString(),
                        rootProject.file("tools/verify_python_payload.py"),
                        "--archive",
                        layout.buildDirectory.file("python/assets/source/${variantDir}/chaquopy/app.imy").get().asFile,
                )
            }
        }
    }
    if (task.name == "mergeReleaseAssets") {
        task.dependsOn(minifyReleaseWebAssets)
    }
}

